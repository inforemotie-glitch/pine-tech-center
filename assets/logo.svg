<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" width="260" height="56" role="img" aria-labelledby="pineCenterLogoTitle">
  <title id="pineCenterLogoTitle">Pine Tech Center</title>
  <defs>
    <linearGradient id="pineCenterShield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065F46"/>
      <stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
  </defs>

  <!-- Architectural command-center shield -->
  <path d="M10 2.5H40L47 9.5V28C47 41 37 49.5 25 54.5 13 49.5 3 41 3 28V9.5Z" fill="url(#pineCenterShield)"/>
  <path d="M11.7 6.3H38.3L43.2 11.2V28C43.2 39 34.8 46.2 25 50.4 15.2 46.2 6.8 39 6.8 28V11.2Z" fill="none" stroke="#F59E0B" stroke-width="1.4"/>

  <!-- Triple-chevron evergreen crown -->
  <g fill="none" stroke-width="3.6" stroke-linejoin="miter">
    <path d="M17.5 18.5 25 12.5 32.5 18.5" stroke="#F59E0B"/>
    <path d="M14 28.8 25 20 36 28.8" stroke="#34D399"/>
    <path d="M11 38.7 25 27.5 39 38.7" stroke="#10B981"/>
  </g>
  <rect x="23.3" y="33" width="3.4" height="9.5" rx=".6" fill="#F59E0B"/>

  <!-- Wordmark -->
  <text x="58" y="28" textLength="172" lengthAdjust="spacing" font-family="'Sora', 'DM Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="800" fill="#064E3B">PINE <tspan fill="#059669">TECH</tspan></text>

  <!-- Center badge block -->
  <rect x="58" y="34" width="172" height="18" rx="2" fill="#064E3B"/>
  <path d="M66 43H102M186 43H222" stroke="#F59E0B" stroke-width="1.6"/>
  <text x="144" y="47.2" text-anchor="middle" textLength="64" lengthAdjust="spacing" font-family="'Sora', 'DM Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">CENTER</text>
</svg>
